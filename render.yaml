# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render provisions the
# service from backend/Dockerfile (which builds the SPA + API into one same-origin image).
services:
  - type: web
    name: common-ground
    runtime: docker
    plan: free
    # Co-located with the Neon database (AWS eu-central-1 / Frankfurt) to keep DB
    # round-trips in-region.
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Neon Postgres connection string (Npgsql key-value form). Secret — paste it in
      # the Render dashboard; never committed. See README/deploy notes for the format.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Random, stable secrets generated by Render on first deploy.
      - key: Jwt__SecretKey
        generateValue: true
      - key: Privacy__HmacKey
        generateValue: true
      # Create schema + seed the questionnaire on first boot against Neon.
      - key: RunMigrationsOnStartup
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
