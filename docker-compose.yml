services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: commonground_dev
      POSTGRES_USER: commonground
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commonground -d commonground_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
