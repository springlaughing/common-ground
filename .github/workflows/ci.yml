name: CI

on:
  # Build/test on main and on every PR targeting main. Feature branches are verified
  # through their PR (no feature-branch push globs): this matches the Sonar workflow
  # (free tier analyzes only main + PRs) and avoids the double run — push + pull_request
  # both firing — that the old, stale `001-*` glob produced for feature 001.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore CommonGround.slnx

      - name: Build
        working-directory: backend
        run: dotnet build CommonGround.slnx --no-restore --configuration Release

      - name: Test
        working-directory: backend
        run: dotnet test CommonGround.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      # The E2E suite mocks /api with Playwright route interception, so it needs only
      # the frontend dev server (started by playwright.config.ts) — no backend.
      # Use the lockfile-pinned local Playwright (via npm run), not npx, so the browser
      # install can't pull an unpinned package on demand.
      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
