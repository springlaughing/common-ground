# SonarCloud quality gate (Constitution Principle VII).
#
# Single analysis covering both stacks via the MSBuild-integrated .NET scanner:
#   - C#  coverage: dotnet-coverage (vscoveragexml) -> coverage.xml
#   - TS  coverage: vitest v8 (lcov)               -> frontend/coverage/lcov.info
#
# Requires the SONAR_TOKEN repo secret and "Automatic Analysis" disabled in the
# SonarCloud project (CI-based analysis cannot coexist with automatic analysis).

name: Sonar

on:
  # The SonarQube Cloud free tier analyzes only the main branch and pull
  # requests (feature/"short-lived" branch analysis requires a paid plan), so
  # there is no point scanning on feature-branch pushes — they upload but are
  # not processed. This matches the constitution's "quality gate on every PR".
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs. They get a separate, restricted secret store, so
    # SONAR_TOKEN is empty and the scan hard-fails — and dependency bumps change
    # no analyzable source anyway. The gate still runs on the push to main after
    # the PR merges (merged by a human, so the token is present), keeping main covered.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarCloud can compute new-code/blame accurately.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Sonar + coverage tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Frontend install + coverage
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Locale catalogs (messages.<locale>.ts) are intentionally parallel — the
          # Messages interface enforces identical keys across languages — so copy-paste
          # detection flags each new translation block as a duplicate of its sibling.
          # Exclude them from duplication only (still analyzed for bugs/smells/coverage).
          dotnet sonarscanner begin \
            /k:"springlaughing_common-ground" \
            /o:"springlaughing" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="frontend/coverage/lcov.info" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,frontend/node_modules/**,frontend/dist/**,**/Migrations/**,**/.specify/**" \
            /d:sonar.coverage.exclusions="backend/tests/**,frontend/tests/**,**/Migrations/**,**/Program.cs,frontend/src/main.tsx,**/*.config.ts,scripts/**" \
            /d:sonar.cpd.exclusions="frontend/src/i18n/messages.*.ts,frontend/tests/e2e/**"

      - name: Build + test backend with coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet build backend/CommonGround.slnx --configuration Release
          dotnet-coverage collect "dotnet test backend/CommonGround.slnx --configuration Release --no-build" -f xml -o coverage.xml

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
