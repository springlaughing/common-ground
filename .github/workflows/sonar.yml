# SonarCloud quality gate (Constitution Principle VII).
#
# Single analysis covering both stacks via the MSBuild-integrated .NET scanner:
#   - C#  coverage: dotnet-coverage (vscoveragexml) -> coverage.xml
#   - TS  coverage: vitest v8 (lcov)               -> frontend/coverage/lcov.info
#
# Requires the SONAR_TOKEN repo secret and "Automatic Analysis" disabled in the
# SonarCloud project (CI-based analysis cannot coexist with automatic analysis).

name: Sonar

on:
  # The SonarQube Cloud free tier analyzes only the main branch and pull
  # requests (feature/"short-lived" branch analysis requires a paid plan), so
  # there is no point scanning on feature-branch pushes — they upload but are
  # not processed. This matches the constitution's "quality gate on every PR".
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can compute new-code/blame accurately.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Sonar + coverage tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Frontend install + coverage
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"springlaughing_common-ground" \
            /o:"springlaughing" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="frontend/coverage/lcov.info" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,frontend/node_modules/**,frontend/dist/**,**/Migrations/**" \
            /d:sonar.coverage.exclusions="backend/tests/**,frontend/tests/**,**/Migrations/**,**/Program.cs,frontend/src/main.tsx,**/*.config.ts"

      - name: Build + test backend with coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet build backend/CommonGround.slnx --configuration Release
          dotnet-coverage collect "dotnet test backend/CommonGround.slnx --configuration Release --no-build" -f xml -o coverage.xml

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
